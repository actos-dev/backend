[workspace]
resolver = "3"
members = [
    "crates/actos-types",
    "crates/actos-core",
    "crates/actos-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
repository = "https://github.com/actos/actos-backend"
authors = ["Actos katkıcıları"]

# Tüm sürümler burada pinlenir; crate'ler `workspace = true` ile alır.
# Böylece iki crate aynı bağımlılığın iki farklı sürümünü çekemez.
[workspace.dependencies]
actos-types = { path = "crates/actos-types" }
actos-core = { path = "crates/actos-core" }

axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower = { version = "0.5.3", features = ["limit", "timeout"] }
tower-http = { version = "0.7.0", features = [
    "trace",
    "timeout",
    "limit",
    "cors",
    "normalize-path",
    "request-id",
    "catch-panic",
    "sensitive-headers",
] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
    "json",
] }

thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
dotenvy = "0.15.7"
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
http = "1.5.0"

redis = { version = "1.6.0", features = ["tokio-rustls-comp"] }
deadpool-redis = "0.23.1"

aws-config = { version = "1.11.0", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-credential-types = "1.3.0"
aws-sdk-s3 = { version = "1.144.0", default-features = false, features = ["rt-tokio", "sigv4a"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"

# Geliştirmede derleme hızı için bağımlılıkları optimize et, kendi kodumuzu etme
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
