[workspace]
resolver = "3"
members = [
    "crates/actos-types",
    "crates/actos-core",
    "crates/actos-api",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
repository = "https://github.com/actos/actos-backend"
authors = ["Actos contributors"]

# Tüm sürümler burada pinlenir; crate'ler `workspace = true` ile alır.
# Böylece iki crate aynı bağımlılığın iki farklı sürümünü çekemez.
[workspace.dependencies]
actos-types = { path = "crates/actos-types" }
actos-core = { path = "crates/actos-core" }

axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7.0", features = [
    "trace",
    "timeout",
    "limit",
    "cors",
    "normalize-path",
    "request-id",
    "catch-panic",
    "sensitive-headers",
    # Güvenlik header'ları (Faz 17): `X-Content-Type-Options`,
    # `Referrer-Policy`, `Content-Security-Policy` — bkz. `crates/actos-api/
    # src/app.rs`.
    "set-header",
] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
    "json",
    # `crates/actos-core/sqlx.toml`'daki `actor_type`/`admin_role` gibi
    # özel Postgres enum'larını query!/query_as! makrolarında girdi
    # parametresi olarak kullanabilmek için (bkz. o dosyadaki yorum).
    "sqlx-toml",
] }

thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
dotenvy = "0.15.7"
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
http = "1.5.0"

# --- Görsel işleme (crates/actos-core/src/media.rs, Faz 13) ---
# `default-features = false`: varsayılan `default-formats` avif/exr/tiff gibi
# kabul etmediğimiz onlarca kod çözücüyü de getiriyor. Yalnızca allowlist'teki
# dört biçimi açmak hem derleme süresini hem de saldırı yüzeyini küçültüyor —
# reddedeceğimiz bir biçimin kod çözücüsünü binary'de taşımanın anlamı yok.
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "rayon",
] }
# Magic byte tespiti. Uzantıya ve `Content-Type` header'ına asla güvenmiyoruz.
infer = "0.22.0"

# --- Sır üretimi (crates/actos-core/src/secret.rs) ---
argon2 = "0.6.0"
rand = "0.10.2"
base62 = "2.2.4"
sha2 = "0.11.0"
subtle = "2.6.1"
hex = "0.4.3"

# Faz 4 — ortak yardımcılar
hmac = "0.13.0"
base64 = "0.23.1"
validator = { version = "0.21.0", features = ["derive"] }
unicode-normalization = "0.1.25"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
ammonia = "4.1.4"

redis = { version = "1.6.0", features = ["tokio-rustls-comp"] }
deadpool-redis = "0.23.1"

# --- Gözlemlenebilirlik (Faz 17: `GET /metrics`) ---
# `metrics`: sadece bir facade (ör. `tracing`'in metrik karşılığı) —
# `actos-core`'un HTTP/Prometheus'u bilmesine gerek kalmadan `counter!`/
# `histogram!`/`gauge!` makrolarını her yerden çağırabilmemizi sağlıyor.
# `metrics-exporter-prometheus`: `metrics`'in kaydını (recorder) Prometheus
# metin formatına çeviren tek somut backend — `axum-prometheus` yerine bunu
# seçtik çünkü `axum-prometheus` yalnızca HTTP istek sayısı/süresini
# otomatikleştiriyor, DB pool durumu ve rate-limit isabet sayısı gibi
# özel metrikleri yine ham `metrics` makrolarıyla eklemek gerekiyordu — iki
# bağımlılık yerine tek bir alt katman (`metrics`) üstüne kendi ince
# middleware'imizi yazmak daha az soyutlama, daha fazla kontrol demek.
# `default-features = false`: varsayılan `http-listener`/`push-gateway`
# feature'ları kendi hyper+rustls tabanlı HTTP sunucusunu getiriyor —
# `/metrics`'i zaten kendi axum route'umuzdan sunacağız (bkz.
# `crates/actos-api/src/routes/mod.rs`), o yığına ihtiyacımız yok. Kalan
# yüzey yalnızca `PrometheusBuilder::install_recorder()` +
# `PrometheusHandle::render()` — gereksiz bağımlılık/derleme süresi/saldırı
# yüzeyi eklemiyor.
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# --- API dokümantasyonu (Faz 16) ---
# `utoipa-axum`'ın 0.1 sürümü axum `^0.7`'ye bağlı — bizim axum 0.8.9 ile
# uyumsuz, o yüzden 0.2'de kalıyoruz. Üçü de OpenAPI 3.1 üretiyor.
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
utoipa-scalar = "0.3.0"

aws-credential-types = "1.3.0"
# TLS sağlayıcısı bilinçli olarak **ring**: sqlx da ring kullanıyor ve tek bir
# süreçte iki farklı rustls kripto sağlayıcısı bulunması çalışma anında
# belirsizliğe yol açıyor. Bu yüzden aws-sdk-s3'ün hazır HTTPS istemcisi
# (aws-lc-rs tabanlı) kapalı; istemciyi aws-smithy-http-client ile elle kuruyoruz.
aws-sdk-s3 = { version = "1.144.0", default-features = false, features = [
    "rt-tokio",
    "http-1x",
    "behavior-version-latest",
] }
aws-smithy-http-client = { version = "1.4.0", default-features = false, features = ["rustls-ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"

# Geliştirmede derleme hızı için bağımlılıkları optimize et, kendi kodumuzu etme
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
