# api.actos.com.tr — Actos backend'e ters vekil.
#
# Kurulum (sunucuda, root):
#   cp api.actos.com.tr.conf /etc/nginx/sites-available/api.actos.com.tr
#   ln -s /etc/nginx/sites-available/api.actos.com.tr /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.actos.com.tr      # 443 bloğunu certbot ekler
#
# ÖNEMLİ SIRA: certbot HTTP-01 doğrulaması yapıyor; Cloudflare'de kayıt
# **gri bulut** (DNS-only) iken çalıştırılmalı. Sertifika alındıktan sonra
# turuncu buluta geçilir ve SSL modu "Full (strict)" yapılır.
#
# Gerçek istemci IP'si: /etc/nginx/conf.d/cloudflare-realip.conf
# (scripts/cloudflare-realip.sh üretiyor). O dosya olmadan hız sınırı
# herkesi tek kovaya sokar — bkz. script'in başındaki açıklama.

server {
    listen 80;
    server_name api.actos.com.tr;

    # certbot bu bloğa 301 yönlendirmesini kendi ekler.
    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/actos-proxy.conf;
    }
}
