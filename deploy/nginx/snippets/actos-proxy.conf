# Ortak ters vekil başlıkları.
# Kurulum: cp actos-proxy.conf /etc/nginx/snippets/

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# 8 MB'lık yükleme sınırı backend'de (MAX_UPLOAD_BYTES); nginx'in
# varsayılan 1 MB'ı ondan önce devreye girip 413 döndürürdü. Biraz pay
# bırakılıyor: multipart zarfı ham dosyadan büyük.
client_max_body_size 12m;
