# media.actos.com.tr — MinIO bucket'ının public-read yüzü.
#
# Yüklenen görsellerin URL'leri bu alan adıyla üretiliyor
# (`S3_PUBLIC_BASE_URL`, bkz. docker-compose.prod.yml). Bucket
# `mc anonymous set download` ile public-read olduğu için imza gerekmiyor;
# nginx yalnızca GET/HEAD geçiriyor — yazma yolları API üzerinden.

server {
    listen 80;
    server_name media.actos.com.tr;

    # Yalnızca okuma: bir yapılandırma hatası MinIO'nun yönetim uçlarını
    # dışarı açarsa bucket silinebilirdi.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        proxy_pass http://127.0.0.1:3103;
        include /etc/nginx/snippets/actos-proxy.conf;

        # Nesneler değişmez (yeni yükleme = yeni anahtar); uzun cache
        # güvenli ve Cloudflare'in kenar önbelleğini de etkinleştirir.
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
