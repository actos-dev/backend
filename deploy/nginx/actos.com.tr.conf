# actos.com.tr — web arayüzü (frontend, Next.js).
#
# Kurulum (sunucuda, root):
#   cp actos.com.tr.conf /etc/nginx/sites-available/actos.com.tr
#   ln -s /etc/nginx/sites-available/actos.com.tr /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d actos.com.tr -d www.actos.com.tr   # 443 bloğunu certbot ekler
#
# ÖNEMLİ SIRA: certbot HTTP-01 doğrulaması yapıyor; Cloudflare'de kayıt
# **gri bulut** (DNS-only) iken çalıştırılmalı. Sertifika alındıktan sonra
# turuncu buluta geçilir ve SSL modu "Full (strict)" yapılır.
#
# Hedef, backend `docker-compose.prod.yml` içindeki `web` servisidir
# (`127.0.0.1:3000`). Cloudflare önbellek kuralları için bkz.
# docs/DEPLOYMENT.md §"Cloudflare ve önbellek".

server {
    listen 80;
    server_name actos.com.tr www.actos.com.tr;

    # certbot bu bloğa 301 yönlendirmesini kendi ekler.
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/actos-proxy.conf;
    }
}
