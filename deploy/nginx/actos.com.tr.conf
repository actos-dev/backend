# actos.com.tr — web arayüzü (frontend, Next.js).
#
# Frontend henüz dağıtılmadı; bu dosya backend turunda yalnızca alan adının
# ve sertifikanın hazır olması için var. `proxy_pass` hedefi frontend
# konteyneri ayağa kalkınca (port 3000) etkinleşir.

server {
    listen 80;
    server_name actos.com.tr www.actos.com.tr;

    # Frontend gelene kadar: backend'in sağlık ucu üzerinden "ayakta"
    # yanıtı ver, kök dizinde bakım sayfası göster.
    location / {
        return 503 "actos.com.tr yakinda\n";
        add_header Content-Type text/plain always;
    }

    # location / {
    #     proxy_pass http://127.0.0.1:3000;
    #     include /etc/nginx/snippets/actos-proxy.conf;
    # }
}
