# Actos backend — actos-types crate'ini crates.io'ya yayınla.
#
# Yalnızca elle tetiklenir (workflow_dispatch); push/tag'a bağlı değil —
# yayın geri alınamaz, bu yüzden tetikleme bilinçli olmalı.
#
# CARGO_REGISTRY_TOKEN repo secret'ından okunur; değer runner'a girer,
# log'a asla basılmaz. Bu crate Apache-2.0; workspace'in geri kalanı
# (actos-api, actos-core) AGPL-3.0-only kalır.

name: Publish actos-types

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece kuru koşu (package + doğrula, yayınlama)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml (kanal 1.96) checkout sonrası otomatik kurulur.
      - uses: Swatinem/rust-cache@v2

      - name: Kuru koşu (paket içeriğini doğrula)
        run: cargo publish -p actos-types --dry-run --allow-dirty
        env:
          CARGO_TERM_COLOR: always

      - name: Gerçek yayın
        if: github.event.inputs.dry_run == 'false'
        run: cargo publish -p actos-types
        env:
          CARGO_TERM_COLOR: always
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}