[package]
name = "actos-api"
description = "Actos REST API sunucusu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
actos-core = { workspace = true }
# `openapi` feature'ı: DTO'lara `ToSchema` türetir (bkz.
# `crates/actos-types/Cargo.toml`). Yalnızca sunucu bu feature'ı açar — CLI/
# SDK tüketicileri `actos-types`'ı bu feature olmadan alır.
actos-types = { workspace = true, features = ["openapi"] }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
deadpool-redis = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
# `POST /admin/bans`'in expires_at alanını RFC 3339'dan ayrıştırmak için.
chrono = { workspace = true }

# --- API dokümantasyonu (Faz 16) ---
# Sürüm/uyumluluk gerekçesi kök `Cargo.toml`'da. `OpenApiRouter` +
# `routes!()` kullanıyoruz (bkz. `crate::routes` modül dokümantasyonu) ki
# rota kaydı ile şema kaydı derleme zamanında aynı yerde kalsın — bir uç
# eklenip anotasyonu unutulursa derlenmesin.
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
# `Scalar` UI için (`GET /docs`, bkz. `crate::routes::mod` dokümantasyonu).
utoipa-scalar = { workspace = true, features = ["axum"] }

[lints]
workspace = true
