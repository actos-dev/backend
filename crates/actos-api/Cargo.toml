[package]
name = "actos-api"
description = "Actos REST API sunucusu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
actos-core = { workspace = true }
# `openapi` feature'ı: DTO'lara `ToSchema` türetir (bkz.
# `crates/actos-types/Cargo.toml`). Yalnızca sunucu bu feature'ı açar — CLI/
# SDK tüketicileri `actos-types`'ı bu feature olmadan alır.
actos-types = { workspace = true, features = ["openapi"] }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
deadpool-redis = { workspace = true }
dotenvy = { workspace = true }
# Gözlemlenebilirlik (Faz 17) — sürüm/feature gerekçesi kök `Cargo.toml`'da.
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
uuid = { workspace = true }
# `POST /admin/bans`'in expires_at alanını RFC 3339'dan ayrıştırmak için.
chrono = { workspace = true }

# --- API dokümantasyonu (Faz 16) ---
# Sürüm/uyumluluk gerekçesi kök `Cargo.toml`'da. `OpenApiRouter` +
# `routes!()` kullanıyoruz (bkz. `crate::routes` modül dokümantasyonu) ki
# rota kaydı ile şema kaydı derleme zamanında aynı yerde kalsın — bir uç
# eklenip anotasyonu unutulursa derlenmesin.
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
# `Scalar` UI için (`GET /docs`, bkz. `crate::routes::mod` dokümantasyonu).
utoipa-scalar = { workspace = true, features = ["axum"] }

[dev-dependencies]
# Generates real PNG/JPEG bytes in-memory for the multipart upload tests
# (`tests/avatar_api.rs`) — see that file's doc for why: sending an actual
# image through the router, not a fixture, is the whole point of that test
# file, and committing binary fixtures for this would be worse than just
# encoding a tiny image at test time.
image = { workspace = true }

[lints]
workspace = true
