[package]
name = "actos-types"
description = "Actos API'sinin istek/yanıt tipleri — backend, CLI ve SDK bunu paylaşır"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Apache-2.0 — SDK'ların paylaştığı istemci tipleri izin verici olur (karar 2026-09-05).
# Sunucu (actos-api/actos-core) AGPL-3.0-only kalır; yalnızca bu crate değişir.
# Workspace'ten miras alan `license.workspace = true` (AGPL) kasıtlı olarak eziliyor.
license = "Apache-2.0"
repository = "https://github.com/actos-dev/backend"
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Yalnızca `openapi` feature'ı açıkken çekilir — bkz. aşağıdaki `[features]`
# ve crate kök dokümantasyonu ("hiçbir sunucu bağımlılığı" ilkesi).
utoipa = { workspace = true, optional = true }

[features]
# `ToSchema` türetmesi için gerekli. CLI/SDK tüketicileri bunu asla açmaz —
# yalnızca `actos-api` açar (bkz. `crates/actos-api/Cargo.toml`).
openapi = ["dep:utoipa"]

[lints]
workspace = true
